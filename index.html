<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Paisa Bolta Hai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#00D68A;--g2:#00AA6E;
  --amber:#FFB830;--red:#FF5252;--blue:#4DA8FF;--purple:#A374FF;--pink:#FF6EC7;--teal:#00E5CC;
  --bg:#0A0A18;--bg2:#12122A;--bg3:#1A1A36;--bg4:#222248;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);
  --txt:#F4F4FF;--txt2:#9898C0;--txt3:#C8C8EE;
  --card-r:20px;--card-r-sm:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;font-size:15px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 20% 0%,rgba(0,214,138,.07),transparent),radial-gradient(ellipse 60% 35% at 80% 100%,rgba(163,116,255,.07),transparent);pointer-events:none;z-index:0}
.screen{position:relative;z-index:1}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt2);font-weight:700}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;letter-spacing:.04em}
.badge-g{background:rgba(0,214,138,.18);color:#00D68A;border:1px solid rgba(0,214,138,.35)}
.badge-a{background:rgba(255,184,48,.18);color:#FFB830;border:1px solid rgba(255,184,48,.35)}
.badge-b{background:rgba(77,168,255,.18);color:#4DA8FF;border:1px solid rgba(77,168,255,.35)}
.badge-p{background:rgba(163,116,255,.18);color:#A374FF;border:1px solid rgba(163,116,255,.35)}
.badge-r{background:rgba(255,82,82,.18);color:#FF5252;border:1px solid rgba(255,82,82,.35)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .18s;letter-spacing:.01em}
.btn-primary{background:linear-gradient(135deg,#00C97F,#00A36A);color:#fff;box-shadow:0 4px 14px rgba(0,201,127,.25)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,201,127,.35)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--txt3);border:1px solid var(--border2)}
.btn-ghost:hover{background:rgba(255,255,255,.13)}
.btn-danger{background:rgba(255,77,77,.13);color:#FF4D4D;border:1px solid rgba(255,77,77,.3)}
.btn-danger:hover{background:rgba(255,77,77,.22)}
.btn-amber{background:rgba(245,166,35,.13);color:#F5A623;border:1px solid rgba(245,166,35,.3)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}
.btn-full{width:100%}

/* CARDS */
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:1.3rem;margin-bottom:1rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.sec-t{font-size:15px;font-weight:700;color:var(--txt)}

/* STAT TILES */
.stat-tile{background:var(--bg3);border:1px solid var(--border);border-radius:var(--card-r-sm);padding:1.1rem 1rem;position:relative;overflow:hidden}
.stat-tile::before{content:'';position:absolute;inset:0;background:var(--tile-grad,none);pointer-events:none}
.stat-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);margin-bottom:6px;font-weight:700}
.stat-v{font-size:clamp(17px,3vw,23px);font-weight:700;color:var(--txt);line-height:1}
.stat-s{font-size:12px;color:var(--txt2);margin-top:5px}
.stat-ico{position:absolute;top:12px;right:12px;font-size:22px;opacity:.4}

/* TOPBAR */
.topbar{background:rgba(10,10,24,.88);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.1);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00D68A,#4DA8FF,#A374FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-r{display:flex;align-items:center;gap:10px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#00D68A;display:inline-block;animation:pulse 2s infinite;box-shadow:0 0 8px rgba(0,214,138,.6)}
.sync-dot.off{background:#FF5252;animation:none;box-shadow:0 0 8px rgba(255,82,82,.6)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* NAV */
.nav-tabs{display:flex;gap:3px;margin-bottom:1.4rem;overflow-x:auto;padding-bottom:2px}
.nav-tabs::-webkit-scrollbar{height:3px}.nav-tabs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.ntab{padding:9px 16px;font-size:13px;font-weight:600;background:none;border:1px solid transparent;border-radius:10px;cursor:pointer;color:var(--txt2);white-space:nowrap;transition:all .15s}
.ntab.on{background:rgba(0,214,138,.14);color:#00D68A;border-color:rgba(0,214,138,.32);box-shadow:0 2px 10px rgba(0,214,138,.12)}
.ntab:hover:not(.on){background:rgba(255,255,255,.06);color:var(--txt3);border-color:rgba(255,255,255,.1)}
.sub-tabs{display:flex;gap:3px;margin-bottom:1.1rem;flex-wrap:wrap}
.sub-tab{padding:7px 15px;font-size:13px;font-weight:600;background:var(--bg3);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--txt2);transition:all .15s}
.sub-tab.on{background:rgba(0,214,138,.14);color:#00D68A;border-color:rgba(0,214,138,.32);box-shadow:0 2px 10px rgba(0,214,138,.12)}

/* MAIN */
.main{padding:1.1rem;max-width:1100px;margin:0 auto}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1rem}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:1rem}
@media(min-width:600px){.g4{grid-template-columns:repeat(4,1fr)}}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);padding:9px 12px;border-bottom:1px solid var(--border);font-weight:700}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--txt3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* FORM */
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;font-size:14px;color:var(--txt);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(0,214,138,.12)}
.field input::placeholder{color:var(--txt2)}
.field select option{background:var(--bg3)}
.err{color:#FF4D4D;font-size:13px;margin-top:6px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,201,127,.13),transparent)}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:2.2rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo .ico{font-size:48px;margin-bottom:10px}
.login-logo h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#00C97F,#4D9FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{font-size:13px;color:var(--txt2);margin-top:4px}
.login-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--bg3);border-radius:12px;padding:5px;margin-bottom:1.75rem}
.ltab{padding:9px;font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;color:var(--txt2);border-radius:8px;transition:all .15s}
.ltab.on{background:var(--bg4);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.35)}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;padding:13px 15px;border-radius:14px;margin-bottom:6px;background:var(--bg3);border:1px solid var(--border);transition:all .15s}
.lb-row:hover{border-color:rgba(255,255,255,.16);transform:translateX(2px)}
.lb-row:first-child{border-color:rgba(255,184,48,.4);background:linear-gradient(135deg,rgba(255,184,48,.08),rgba(255,184,48,.03))}
.lb-row:nth-child(2){border-color:rgba(200,200,240,.2);background:linear-gradient(135deg,rgba(200,200,240,.05),transparent)}
.lb-row:nth-child(3){border-color:rgba(200,140,80,.25);background:linear-gradient(135deg,rgba(200,140,80,.07),transparent)}
.lb-rk{font-size:20px;width:38px;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-nm{font-size:14px;font-weight:700;color:var(--txt)}
.lb-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.lb-val{text-align:right}
.lb-v{font-size:14px;font-weight:700;color:#00C97F}
.lb-ch{font-size:12px;margin-top:2px}

/* SCENARIO CARD */
.sc-card{background:linear-gradient(135deg,rgba(0,214,138,.08),rgba(77,168,255,.06));border:1px solid rgba(0,214,138,.25);border-radius:var(--card-r);padding:1.3rem;margin-bottom:1rem;position:relative;overflow:hidden}
.sc-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(0,214,138,.15),transparent 70%);pointer-events:none}
.sc-card-title{font-size:16px;font-weight:700;color:#00D68A;margin-bottom:5px}
.sc-card-desc{font-size:13px;color:var(--txt3);line-height:1.55;margin-bottom:11px}
.sc-effects{display:flex;flex-wrap:wrap;gap:5px}
.sc-eff{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.sc-eff.pos{background:rgba(0,214,138,.18);color:#00D68A}
.sc-eff.neg{background:rgba(255,82,82,.18);color:#FF5252}
.sc-eff.neu{background:rgba(255,255,255,.08);color:var(--txt2)}
.sc-forced{background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.25);border-radius:10px;padding:10px 13px;margin-top:11px;font-size:13px;color:#FF8080}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:64px;margin:10px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-inner{width:100%;border-radius:5px 5px 0 0;min-height:3px;transition:height .4s}
.bar-label{font-size:10px;color:var(--txt2);text-align:center}

/* PORTFOLIO BARS */
.pb{margin-bottom:13px}
.pb-top{display:flex;justify-content:space-between;margin-bottom:5px}
.pb-nm{font-size:13px;font-weight:600;color:var(--txt)}
.pb-vl{font-size:13px;color:var(--txt2)}
.pb-track{background:rgba(255,255,255,.06);border-radius:5px;height:9px;overflow:hidden}
.pb-fill{height:100%;border-radius:5px;transition:width .5s}

/* TRANSACTIONS */
.tx-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-right:12px;flex-shrink:0}
.tx-in{flex:1;min-width:0}
.tx-nm{font-size:14px;font-weight:600;color:var(--txt)}
.tx-ti{font-size:12px;color:var(--txt2);margin-top:2px}
.tx-am{font-size:14px;font-weight:700;flex-shrink:0}
.tx-am.neg{color:#FF5252}.tx-am.pos{color:#00D68A}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:1rem}
@media(min-width:560px){.modal-bg{align-items:center}}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:22px 22px 16px 16px;padding:1.75rem;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
@media(min-width:560px){.modal{border-radius:22px}}
.modal-t{font-size:17px;font-weight:700;margin-bottom:1.25rem}
.modal-a{display:flex;gap:9px;margin-top:1.4rem}
.modal-a .btn{flex:1}

/* MISC */
.empty{text-align:center;color:var(--txt2);font-size:14px;padding:2.5rem}
.toggle{position:relative;display:inline-block;width:42px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.1);border-radius:20px;transition:.2s}
.sl:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:var(--g1)}
input:checked+.sl:before{transform:translateX(18px)}
#loadingOverlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px}
.spinner{width:44px;height:44px;border:3px solid rgba(0,201,127,.2);border-top-color:#00C97F;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stock-selector{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.stock-pill{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--txt2);transition:all .15s}
.stock-pill:hover{background:var(--bg4)}

/* STATION HERO */
.station-hero{border-radius:var(--card-r);padding:1.6rem;text-align:center;margin-bottom:1rem}

/* TEAM CARD in station */
.team-port-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--card-r-sm);padding:1rem;margin-bottom:.75rem}
.team-port-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.team-port-name{font-size:14px;font-weight:700;color:var(--txt)}
.team-port-stats{display:flex;gap:10px}
.team-port-stat{text-align:right}
.team-port-stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.team-port-stat-v{font-size:13px;font-weight:700;color:var(--txt)}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="color:var(--txt2);font-size:14px;font-weight:500">Connecting to server…</div>
</div>

<div id="loginScreen" class="screen">
  <div class="login-wrap"><div class="login-card">
    <div class="login-logo"><div class="ico">💰</div><h1>Paisa Bolta Hai</h1><p>Financial Literacy Game for Schools & Colleges</p></div>
    <div class="login-tabs" id="loginTabs">
      <button class="ltab on" onclick="setLTab('admin',0)">🛡 Admin</button>

</div>

      <span class="sync-dot" id="dot"></span>
      <span id="aRndBadge" class="badge badge-a"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Exit</button>

  </div>
  <div class="main">
    <div class="nav-tabs" id="adminTabs">
      <button class="ntab on" onclick="aTab('dashboard',0)">📊 Dashboard</button>
      <button class="ntab" onclick="aTab('teams',1)">👥 Teams</button>
      <button class="ntab" onclick="aTab('stations',2)">🏦 Stations</button>
      <button class="ntab" onclick="aTab('rounds',3)">🎯 Rounds</button>
      <button class="ntab" onclick="aTab('settings',4)">⚙️ Settings</button>

<div id="stationScreen" class="screen">
  <div class="topbar">
    <span class="topbar-logo">💰 Paisa Bolta Hai</span>
    <div class="topbar-r">
      <span class="sync-dot" id="dotSt"></span>
      <span id="stBadge" class="badge badge-b"></span>
      <span id="stRnd" class="badge badge-a"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Exit</button>
    </div>
  </div>

</div>

<div id="teamScreen" class="screen">
  <div class="topbar">
    <span class="topbar-logo">💰 Paisa Bolta Hai</span>
    <div class="topbar-r">
      <span class="sync-dot" id="dotTm"></span>
      <span id="tmBadge" class="badge badge-p"></span>
      <span id="tmRnd" class="badge badge-a"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Exit</button>
    </div>
  </div>
  <div class="main" id="teamContent"></div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://qedwngdfnbphaytmtbzn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlZHduZ2RmbmJwaGF5dG10YnpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2Njc4MzgsImV4cCI6MjA5MjI0MzgzOH0.LyaJl2ncc0Z1C7-buiFPtnJZm-L-K9x1LDzkuNzdj5I';
const sb = createClient(SB_URL, SB_KEY);

const SC = {
  'Education':          {c:'#4DA8FF',bg:'rgba(77,168,255,.14)',  i:'📚'},
  'Insurance':          {c:'#00D68A',bg:'rgba(0,214,138,.14)',   i:'🛡️'},
  'Stocks/Mutual Funds':{c:'#A374FF',bg:'rgba(163,116,255,.14)', i:'📈'},
  'Real Estate':        {c:'#FF7A5C',bg:'rgba(255,122,92,.14)',  i:'🏠'},
  'Fixed Deposits':     {c:'#FFB830',bg:'rgba(255,184,48,.14)',  i:'🏦'},
  'Business':           {c:'#FF6EC7',bg:'rgba(255,110,199,.14)', i:'💼'},
  'Gold/Commodities':   {c:'#FFD700',bg:'rgba(255,215,0,.14)',   i:'🥇'},
  'Cryptocurrency':     {c:'#9B6DFF',bg:'rgba(155,109,255,.14)', i:'₿'},
};
const STOCK_COLORS = ['#00D68A','#4DA8FF','#A374FF','#FFB830','#FF7A5C','#FF6EC7','#00E5CC'];

let DB = { game:{}, teams:[], stations:[], scenarios:[], transactions:[], portfolio:[], stocks:[] };
let user = null;
let curATab = 'dashboard';
let selectedStockId = null;
let adminTeamTab = null;
let adminStTab   = null;
let settingsTab  = 'game';
let tmTab        = 'home';
let stTab        = 'invest'; // station sub-tab: 'invest' | 'teams'

const fmt  = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fpc  = n => (n > 0 ? '+' : '') + n + '%';
const uid  = () => Math.random().toString(36).slice(2,10);
const setDot = ok => document.querySelectorAll('.sync-dot').forEach(d => d.classList.toggle('off',!ok));
const teamNetWorth = t => t.bal + DB.portfolio.filter(p=>p.team_id===t.id).reduce((s,p)=>s+p.amount,0);
const teamInvested = tid => DB.portfolio.filter(p=>p.team_id===tid).reduce((s,p)=>s+p.amount,0);

// ── LOAD ──
async function loadAll() {
  try {
    const [g,teams,stations,scenarios,txs,port,stocks] = await Promise.all([
      sb.from('game').select('*').eq('id','main').single(),
      sb.from('teams').select('*').order('created_at'),
      sb.from('stations').select('*').order('id'),
      sb.from('scenarios').select('*').order('round_order'),
      sb.from('transactions').select('*').order('ts',{ascending:false}).limit(300),
      sb.from('portfolio').select('*'),
      sb.from('stocks').select('*').order('id'),
    ]);
    if (g.error) throw g.error;
    DB.game=g.data; DB.teams=teams.data||[]; DB.stations=stations.data||[];
    DB.scenarios=scenarios.data||[]; DB.transactions=txs.data||[];
    DB.portfolio=port.data||[]; DB.stocks=stocks.data||[];
    if (!selectedStockId && DB.stocks.length) selectedStockId=DB.stocks[0].id;
    if (!adminTeamTab && DB.teams.length) adminTeamTab=DB.teams[0].id;
    if (!adminStTab && DB.stations.length) adminStTab=DB.stations[0].id;
    setDot(true); return true;
  } catch(e) { console.error(e); setDot(false); return false; }
}

function subscribeAll() {
  ['game','teams','stations','scenarios','transactions','portfolio','stocks','round_history'].forEach(tbl => {
    sb.channel('rt_'+tbl).on('postgres_changes',{event:'*',schema:'public',table:tbl},async()=>{
      await loadAll(); rerenderCurrent();
    }).subscribe(s=>{ if(s==='SUBSCRIBED') setDot(true); });
  });
}
function rerenderCurrent() {
  if (!user) return;
  if (user.role==='admin')   renderAdmin(curATab);
  if (user.role==='station') renderSt();
  if (user.role==='team')    renderTmInner();
}

async function boot() {
  try { const s=sessionStorage.getItem('pbh_user'); if(s) user=JSON.parse(s); } catch(e){}
  const ok = await loadAll();
  if (!ok) {
    document.getElementById('loadingOverlay').innerHTML=`<div style="color:#FF4D4D;text-align:center;padding:2rem;font-size:15px;font-weight:600">❌ Cannot connect to Supabase<br><span style="font-size:13px;color:#8888AA;font-weight:400;margin-top:8px;display:block">Check your URL, anon key, and that RLS is disabled.</span></div>`;
    return;
  }
  subscribeAll();
  document.getElementById('loadingOverlay').style.display='none';
  user ? showSc(user.role) : showSc('login');
}

let lTab='admin';
window.setLTab=(tab,i)=>{ lTab=tab; document.querySelectorAll('.ltab').forEach((b,j)=>b.classList.toggle('on',j===i)); renderLF(); };
function renderLF() {
  const f=document.getElementById('loginForm');
  if (lTab==='admin') {
    f.innerHTML=`<div class="field"><label>Admin PIN</label><input type="password" id="pin" placeholder="Enter PIN"/></div>
    <button class="btn btn-primary btn-full" onclick="doLogin('admin')">Enter as Admin →</button><p class="err" id="le"></p>`;
  } else if (lTab==='station') {
    const o=DB.stations.filter(s=>s.active).map(s=>`<option value="${s.id}">${(SC[s.name]||{i:'💰'}).i} ${s.name}</option>`).join('');
    f.innerHTML=`<div class="field"><label>Station</label><select id="stSel">${o}</select></div>
    <div class="field"><label>PIN</label><input type="password" id="pin" placeholder="Enter PIN"/></div>
    <button class="btn btn-primary btn-full" onclick="doLogin('station')">Enter as Mentor →</button><p class="err" id="le"></p>`;
  } else {
    const o=DB.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
    f.innerHTML=`<div class="field"><label>Team</label><select id="tmSel">${o}</select></div>
    <div class="field"><label>PIN</label><input type="password" id="pin" placeholder="Enter PIN"/></div>
    <button class="btn btn-primary btn-full" onclick="doLogin('team')">Enter as Team →</button><p class="err" id="le"></p>`;
  }
}
window.doLogin=role=>{
  const pin=document.getElementById('pin').value;
  if (role==='admin') {
    if (pin!==DB.game.admin_pin){document.getElementById('le').textContent='Wrong PIN';return;}
    user={role:'admin'};
  } else if (role==='station') {
    const sid=document.getElementById('stSel').value;
    const st=DB.stations.find(s=>s.id===sid);
    if (!st||pin!==st.pin){document.getElementById('le').textContent='Wrong PIN';return;}
    user={role:'station',sid};
  } else {
    const tid=document.getElementById('tmSel').value;
    const tm=DB.teams.find(t=>t.id===tid);
    if (!tm||pin!==tm.pin){document.getElementById('le').textContent='Wrong PIN';return;}
    user={role:'team',tid};
  }
  sessionStorage.setItem('pbh_user',JSON.stringify(user));
  showSc(role);
};
window.logout=()=>{ user=null; sessionStorage.removeItem('pbh_user'); showSc('login'); };
function showSc(r) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(r==='login'?'loginScreen':r+'Screen').classList.add('on');
  if (r==='login'){renderLF();return;}
  if (r==='admin')   renderAdmin('dashboard');
  if (r==='station') renderSt();
  if (r==='team')    renderTm();
}

// ── DASHBOARD ──
function miniBar(teams) {
  const vals=teams.map(t=>teamNetWorth(t)),max=Math.max(...vals,1);
  const colors=['#F5A623','#9B6DFF','#4D9FFF','#FF6B4D','#00C97F','#FF4D9B','#FFD700'];
  return `<div class="bar-chart">${teams.map((t,i)=>{
    const h=Math.round((vals[i]/max)*58);
    return `<div class="bar-col"><div class="bar-inner" style="height:${h}px;background:${colors[i%colors.length]}"></div><div class="bar-label">${t.name.split(' ')[0]}</div></div>`;
  }).join('')}</div>`;
}
function raDash() {
  const sorted=[...DB.teams].sort((a,b)=>teamNetWorth(b)-teamNetWorth(a));
  const totalInv=DB.portfolio.reduce((s,p)=>s+p.amount,0);

  const recent=DB.transactions.slice(0,6);
  const txH=recent.map(tx=>{
    const s=SC[tx.station_name]||{bg:'rgba(255,255,255,.08)',i:'💰'};

    <div class="label" style="margin-bottom:6px;color:#00D68A">Round ${g.cur_round} Active Scenario</div>

window.adjustBalance=async(tid,sign)=>{
  const rawAmt=parseInt(document.getElementById('adjAmt_'+tid).value)||0;
  const tag=document.getElementById('adjTag_'+tid).value.trim()||'Admin adjustment';
  if (rawAmt<=0){toast('Enter a valid amount','r');return;}
  const amt=Math.abs(rawAmt)*sign;
  const t=DB.teams.find(x=>x.id===tid);
  await sb.from('teams').update({bal:Math.max(0,t.bal+amt)}).eq('id',tid);
  await sb.from('transactions').insert({id:uid(),team_id:tid,station_name:'Admin',type:'adjust',amount:amt,tag,round:DB.game.cur_round||0,ts:Date.now()});
  await loadAll(); renderAdminTeamDetail(tid);
  toast(`${amt>=0?'Added':'Deducted'} ${fmt(Math.abs(amt))} ${amt>=0?'to':'from'} ${t.name}`);
};

function raRounds() {
  const cards=DB.scenarios.map((sc,i)=>{
    const done=i<DB.game.cur_round,active=i===DB.game.cur_round-1&&DB.game.status==='active';

// ── GAME ACTIONS ──
window.startGame=async()=>{
  if (!DB.teams.length){toast('Add at least one team!','r');return;}
  for (const t of DB.teams) await sb.from('teams').update({bal:DB.game.start_bal,insured:false}).eq('id',t.id);
  await sb.from('portfolio').delete().neq('id','x');
  await sb.from('transactions').delete().neq('id','x');
  await sb.from('round_history').delete().neq('id','x');
  for (const stk of DB.stocks) await sb.from('stocks').update({prices:[stk.prices[0]??100]}).eq('id',stk.id);
  await sb.from('game').update({status:'active',cur_round:1,updated_at:new Date()}).eq('id','main');
  await loadAll(); renderAdmin('dashboard');
};
window.endRound=async()=>{
  const sc=DB.scenarios[DB.game.cur_round-1];
  if (!sc){toast('No scenario configured for this round!','r');return;}
  if (!confirm(`Apply returns for Round ${DB.game.cur_round}: "${sc.name}"?`)) return;
  for (const t of DB.teams) {
    const port=DB.portfolio.filter(p=>p.team_id===t.id);
    let newBal=t.bal;
    for (const p of port) {
      const ret=(sc.effects||{})[p.station_name]??0,gain=Math.round(p.amount*ret/100);
      newBal+=gain;
      if (gain!==0) await sb.from('transactions').insert({id:uid(),team_id:t.id,station_name:p.station_name,type:'return',amount:gain,round:DB.game.cur_round,ts:Date.now()});
    }
    if (sc.forced_amt&&(!sc.forced_uninsured||!t.insured)){
      newBal=Math.max(0,newBal-sc.forced_amt);
      await sb.from('transactions').insert({id:uid(),team_id:t.id,station_name:'Event',type:'forced',amount:-sc.forced_amt,round:DB.game.cur_round,ts:Date.now()});
    }
    await sb.from('teams').update({bal:newBal}).eq('id',t.id);
  }
  await sb.from('round_history').insert({id:uid(),round:DB.game.cur_round,scenario_name:sc.name});
  const newStatus=DB.game.cur_round>=DB.game.total_rounds?'ended':'active';
  await sb.from('game').update({status:newStatus,updated_at:new Date()}).eq('id','main');
  await loadAll(); renderAdmin('dashboard');
};
window.nextRound=async()=>{
  if (!confirm('Start next round? Portfolios carry over.')) return;
  await sb.from('game').update({cur_round:DB.game.cur_round+1,updated_at:new Date()}).eq('id','main');
  await loadAll(); renderAdmin('dashboard');
};
window.resetGame=async()=>{
  if (!confirm('Reset entire game? All progress will be lost.')) return;
  for (const t of DB.teams) await sb.from('teams').update({bal:DB.game.start_bal,insured:false}).eq('id',t.id);
  await sb.from('portfolio').delete().neq('id','x');
  await sb.from('transactions').delete().neq('id','x');
  await sb.from('round_history').delete().neq('id','x');
  for (const stk of DB.stocks) await sb.from('stocks').update({prices:[stk.prices[0]??100]}).eq('id',stk.id);
  await sb.from('game').update({status:'setup',cur_round:0,updated_at:new Date()}).eq('id','main');
  await loadAll(); renderAdmin('dashboard');
};
window.saveSettings=async()=>{
  await sb.from('game').update({name:document.getElementById('sN').value,start_bal:parseInt(document.getElementById('sB').value)||500000,admin_pin:document.getElementById('sP').value,total_rounds:parseInt(document.getElementById('sTR').value)||4}).eq('id','main');

function stockChartUI(isAdmin=false) {
  const stocks=DB.stocks;
  if (!stocks.length) return `<div class="empty">No stocks yet${isAdmin?' — add in ⚙️ Settings':''}</div>`;
  const sel=stocks.find(s=>s.id===selectedStockId)||stocks[0];
  const prices=sel.prices||[100];
  const col=STOCK_COLORS[stocks.findIndex(s=>s.id===sel.id)%STOCK_COLORS.length];
  const pills=stocks.map(s=>{
    const c=STOCK_COLORS[stocks.findIndex(x=>x.id===s.id)%STOCK_COLORS.length];
    const on=s.id===sel.id;
    const last=s.prices[s.prices.length-1],first=s.prices[0];
    const chg=first>0?(((last-first)/first)*100).toFixed(1):0;
    return `<button class="stock-pill" style="${on?`background:${c};color:#fff;border-color:${c};`:''}" onclick="selectStock('${s.id}')">${s.symbol} <span style="opacity:.75;font-size:11px">${parseFloat(chg)>=0?'▲':'▼'}${Math.abs(chg)}%</span></button>`;
  }).join('');
  const W=500,H=150,pL=44,pB=26,pT=10,pR=16;
  const cW=W-pL-pR,cH=H-pB-pT;
  const minP=Math.min(...prices)*.92,maxP=Math.max(...prices)*1.08;
  const n=prices.length;
  const xS=i=>pL+(n>1?(i/(n-1))*cW:cW/2);
  const yS=v=>pT+cH-((v-minP)/(maxP-minP||1))*cH;
  const pts=prices.map((p,i)=>`${xS(i)},${yS(p)}`).join(' ');
  const area=`${xS(0)},${H-pB} `+prices.map((p,i)=>`${xS(i)},${yS(p)}`).join(' ')+` ${xS(n-1)},${H-pB}`;
  const yTicks=[minP,(minP+maxP)/2,maxP].map(v=>`<line x1="${pL}" x2="${W-pR}" y1="${yS(v)}" y2="${yS(v)}" stroke="rgba(255,255,255,.05)" stroke-width="1"/><text x="${pL-5}" y="${yS(v)+4}" text-anchor="end" font-size="10" fill="#9090B8">${Math.round(v)}</text>`).join('');
  const xTicks=prices.map((_,i)=>`<text x="${xS(i)}" y="${H-7}" text-anchor="middle" font-size="10" fill="#9090B8">R${i+1}</text>`).join('');
  const dots=prices.map((p,i)=>`<circle cx="${xS(i)}" cy="${yS(p)}" r="4" fill="${col}" stroke="var(--bg2)" stroke-width="2"/>`).join('');
  const last=prices[prices.length-1],first2=prices[0];
  const totalChg=first2>0?(((last-first2)/first2)*100).toFixed(1):0;
  const isUp=parseFloat(totalChg)>=0;
  const adminControls=isAdmin?`<div style="margin-top:14px;display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap">
    <div style="flex:1;min-width:130px"><div style="font-size:11px;color:var(--txt2);margin-bottom:5px;font-weight:700;text-transform:uppercase">New price for ${sel.symbol}</div>
      <input type="number" id="newStockPrice" value="${last}" style="width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;font-size:14px;color:var(--txt)"/></div>
    <button class="btn btn-primary btn-sm" onclick="pushStockPrice('${sel.id}')">Push Update →</button></div>`:'';
  return `<div class="stock-selector">${pills}</div>
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:19px;font-weight:700;color:var(--txt)">${sel.name}</span>
      <span style="font-size:14px;color:var(--txt2)">${sel.symbol}</span>
      <span style="font-size:17px;font-weight:700;color:${col}">₹${last}</span>
      <span style="font-size:13px;color:${isUp?'#00C97F':'#FF4D4D'};font-weight:600">${isUp?'▲':'▼'} ${Math.abs(totalChg)}% overall</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".2"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${yTicks}${xTicks}
      <polygon points="${area}" fill="url(#sg)"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>${adminControls}`;
}
window.pushStockPrice=async id=>{
  const v=parseInt(document.getElementById('newStockPrice').value);
  if (!v||v<=0){toast('Enter a valid price','r');return;}
  const stk=DB.stocks.find(s=>s.id===id);
  await sb.from('stocks').update({prices:[...stk.prices,v]}).eq('id',id);
  await loadAll(); rerenderCurrent(); toast(`📈 ${stk.symbol} updated to ₹${v}`);
};
window.openAddStock=()=>modal(`<div class="modal-t">Add Stock</div>
  <div class="field"><label>Company Name</label><input id="mN" placeholder="e.g. TechCorp"/></div>
  <div class="field"><label>Symbol</label><input id="mSym" placeholder="e.g. TCC"/></div>
  <div class="field"><label>Starting Price (₹)</label><input id="mSP" type="number" value="100"/></div>
  <div class="modal-a"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStock()">Add Stock</button></div>`);
window.saveStock=async()=>{
  const n=document.getElementById('mN').value.trim(),sym=document.getElementById('mSym').value.trim().toUpperCase();
  const sp=parseInt(document.getElementById('mSP').value)||100;
  if (!n||!sym) return;
  await sb.from('stocks').insert({id:'stk'+uid(),name:n,symbol:sym,prices:[sp]});
  closeModal(); await loadAll(); rerenderCurrent();
};
window.delStock=async id=>{
  if (!confirm('Remove this stock?')) return;
  await sb.from('stocks').delete().eq('id',id);
  await loadAll(); selectedStockId=DB.stocks[0]?.id||null; rerenderCurrent();
};

// ══════════════════════════════════════════
// STATION SCREEN — Home + Teams tabs
// ══════════════════════════════════════════
function renderSt() {
  const st=DB.stations.find(s=>s.id===user.sid); if(!st) return;
  const s=SC[st.name]||{i:'💰',c:'#888',bg:'rgba(255,255,255,.08)'};
  document.getElementById('stBadge').textContent=st.name;
  document.getElementById('stRnd').textContent=DB.game.status==='active'?`Round ${DB.game.cur_round}/${DB.game.total_rounds}`:'Waiting';
  document.getElementById('stationContent').innerHTML=`
    <div class="station-hero" style="background:${s.bg};border:1px solid ${s.c}33;text-align:center;margin-bottom:0">
      <div style="font-size:48px;margin-bottom:10px">${s.i}</div>
      <div style="font-size:22px;font-weight:800;color:${s.c};margin-bottom:4px">${st.name}</div>
      <div style="font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:12px">${st.description}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <span class="badge badge-g">Base: ${st.base_ret}%/round</span>
        <span class="badge badge-b">Total: ${fmt(DB.portfolio.filter(p=>p.station_name===st.name).reduce((s,p)=>s+p.amount,0))}</span>
        ${(st.subs||[]).length?`<span class="badge badge-p">${(st.subs||[]).length} sub-categories</span>`:''}
      </div>
    </div>
    <div class="nav-tabs" style="margin-top:1.1rem">
      <button class="ntab st-tab ${stTab==='invest'?'on':''}" onclick="setStTab('invest')">💳 Invest</button>
      <button class="ntab st-tab ${stTab==='teams'?'on':''}" onclick="setStTab('teams')">👥 Teams</button>
    </div>
    <div id="stTabContent"></div>`;
  renderStTab();
}
window.setStTab=tab=>{
  stTab=tab;
  document.querySelectorAll('.st-tab').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick').includes(`'${tab}'`)));
  renderStTab();
};
function renderStTab() {
  const c=document.getElementById('stTabContent'); if(!c) return;
  const st=DB.stations.find(s=>s.id===user.sid); if(!st) return;
  const sc=SC[st.name]||{i:'💰',c:'#888',bg:'rgba(255,255,255,.08)'};
  if (stTab==='invest') {
    const tOpts=DB.teams.map(t=>`<option value="${t.id}">${t.name} — ${fmt(t.bal)} cash</option>`).join('');
    const subs=(st.subs||[]).map(s=>`<option value="${s}">${s}</option>`).join('');
    const recent=DB.transactions.filter(tx=>tx.station_name===st.name&&tx.type==='invest').slice(0,6);
    const txH=recent.map(tx=>{
      const tm=DB.teams.find(t=>t.id===tx.team_id);
      return `<div class="tx-row"><div class="tx-ic" style="background:${sc.bg}">${sc.i}</div>
        <div class="tx-in"><div class="tx-nm">${tm?.name||'?'}${tx.tag?` · <span style="font-size:12px;background:var(--bg4);border-radius:5px;padding:2px 7px;color:var(--txt2)">${tx.tag}</span>`:''}</div>
        <div class="tx-ti">Round ${tx.round} · ${new Date(tx.ts).toLocaleTimeString()}</div></div>
        <div class="tx-am neg">${fmt(Math.abs(tx.amount))}</div></div>`;
    }).join('')||'<div class="empty">No investments at this station yet</div>';
    c.innerHTML=DB.game.status!=='active'?`<div class="sec"><div class="empty" style="padding:2.5rem">⏳ Waiting for admin to start the game</div></div>`:`
      <div class="sec">
        <div class="sec-t" style="margin-bottom:1.1rem">Record Investment</div>
        <div class="field"><label>Team</label><select id="invT">${tOpts}</select></div>
        <div class="field"><label>Amount (₹)</label><input type="number" id="invA" placeholder="Enter amount to invest"/></div>
        ${subs?`<div class="field"><label>Sub-category</label><select id="invSub">${subs}<option value="__custom__">Other (type below)…</option></select></div>`:''}
        <div class="field"><label>Custom tag <span style="color:var(--txt2);font-weight:400;text-transform:none">(optional)</span></label><input type="text" id="invTag" placeholder="e.g. MBA in Finance, Bitcoin SIP…"/></div>
        ${st.name==='Insurance'?`<div style="background:rgba(0,201,127,.08);border:1px solid rgba(0,201,127,.2);border-radius:11px;padding:12px 14px;margin-bottom:1rem;font-size:13px;color:#00C97F;line-height:1.5">🛡️ Purchasing insurance protects this team from forced event penalties</div>`:''}
        <button class="btn btn-primary btn-full" style="font-size:15px;padding:13px" onclick="recInv('${st.id}')">Confirm Investment →</button>
        <p class="err" id="invE"></p>
      </div>
      <div class="sec"><div class="sec-h"><span class="sec-t">Recent at this Station</span></div>${txH}</div>`;
  } else {
    // Teams tab — all teams portfolio in cards
    const teamCards=DB.teams.map(t=>{
      const port=DB.portfolio.filter(p=>p.team_id===t.id);
      const tot=port.reduce((s,p)=>s+p.amount,0);
      const n=teamNetWorth(t);
      const portRows=port.map(p=>{
        const ps=SC[p.station_name]||{i:'💰',c:'#888'};
        const pc=tot>0?Math.round(p.amount/tot*100):0;
        const tags=DB.transactions.filter(tx=>tx.team_id===t.id&&tx.station_name===p.station_name&&tx.tag).map(tx=>`<span style="font-size:11px;background:var(--bg4);border-radius:5px;padding:2px 6px;color:var(--txt2)">${tx.tag}</span>`).join(' ');
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:15px;flex-shrink:0">${ps.i}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--txt);margin-bottom:4px">${p.station_name} ${tags}</div>
            <div style="height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden"><div style="width:${pc}%;height:100%;background:${ps.c};border-radius:3px"></div></div>
          </div>
          <span style="font-size:13px;font-weight:700;color:${ps.c};flex-shrink:0">${fmt(p.amount)}</span>
        </div>`;
      }).join('')||`<div style="font-size:13px;color:var(--txt2);padding:8px 0">No investments yet</div>`;
      return `<div class="team-port-card">
        <div class="team-port-header">
          <div class="team-port-name">${t.name}${t.insured?' 🛡️':''}</div>
          <div class="team-port-stats">
            <div class="team-port-stat" style="margin-right:12px"><div class="team-port-stat-l">Cash</div><div class="team-port-stat-v" style="color:#4D9FFF">${fmt(t.bal)}</div></div>
            <div class="team-port-stat" style="margin-right:12px"><div class="team-port-stat-l">Invested</div><div class="team-port-stat-v" style="color:#9B6DFF">${fmt(tot)}</div></div>
            <div class="team-port-stat"><div class="team-port-stat-l">Net Worth</div><div class="team-port-stat-v" style="color:#00C97F">${fmt(n)}</div></div>
          </div>
        </div>
        ${portRows}
      </div>`;
    }).join('');
    c.innerHTML=`<div>${teamCards||'<div class="sec"><div class="empty">No teams yet</div></div>'}</div>`;
  }
}
window.recInv=async sid=>{
  const st=DB.stations.find(s=>s.id===sid);
  const tid=document.getElementById('invT').value;
  const t=DB.teams.find(x=>x.id===tid);
  const amt=parseInt(document.getElementById('invA').value)||0;
  const subEl=document.getElementById('invSub');
  const subSel=subEl?subEl.value:'';
  const customTag=document.getElementById('invTag').value.trim();
  const tag=customTag||(subSel&&subSel!=='__custom__'?subSel:'');
  const e=document.getElementById('invE');
  if (amt<=0){e.textContent='Please enter a valid amount';return;}
  if (amt>t.bal){e.textContent=`${t.name} only has ${fmt(t.bal)} available`;return;}
  await sb.from('teams').update({bal:t.bal-amt,...(st.name==='Insurance'?{insured:true}:{})}).eq('id',tid);
  const existing=DB.portfolio.find(p=>p.team_id===tid&&p.station_name===st.name);
  if (existing) await sb.from('portfolio').update({amount:existing.amount+amt}).eq('id',existing.id);
  else await sb.from('portfolio').insert({id:'p'+uid(),team_id:tid,station_name:st.name,amount:amt,round:DB.game.cur_round});
  await sb.from('transactions').insert({id:uid(),team_id:tid,station_name:st.name,type:'invest',amount:-amt,tag,round:DB.game.cur_round,ts:Date.now()});
  document.getElementById('invA').value=''; e.textContent='';
  await loadAll(); renderSt();
  toast(`✅ ${t.name} invested ${fmt(amt)} in ${st.name}${tag?' · '+tag:''}`);
};

window.setTmTab=tab=>{
  tmTab=tab;
  document.querySelectorAll('.tm-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  renderTmTab();
};
function renderTmTab() {
  const c=document.getElementById('tmTabContent'); if(!c) return;
  const t=DB.teams.find(x=>x.id===user.tid); if(!t) return;
  if (tmTab==='home') {
    const port=DB.portfolio.filter(p=>p.team_id===t.id);
    const tot=port.reduce((s,p)=>s+p.amount,0);
    const n=teamNetWorth(t),d=n-DB.game.start_bal;
    const pct=n>0?Math.round(tot/n*100):0;
    const portItems=port.map(p=>{
      const s=SC[p.station_name]||{i:'💰',c:'#888'};
      const pc=tot>0?Math.round(p.amount/tot*100):0;
      const tags=DB.transactions.filter(tx=>tx.team_id===t.id&&tx.station_name===p.station_name&&tx.tag).map(tx=>`<span style="font-size:11px;background:var(--bg4);border-radius:5px;padding:2px 7px;color:var(--txt2)">${tx.tag}</span>`).join(' ');
      return `<div class="pb" style="margin-bottom:16px"><div class="pb-top"><span class="pb-nm">${s.i} ${p.station_name} ${tags}</span><span class="pb-vl">${fmt(p.amount)} · ${pc}%</span></div>
        <div class="pb-track"><div class="pb-fill" style="width:${pc}%;background:${s.c}"></div></div></div>`;
    }).join('')||'<div class="empty">No investments yet — visit the stations!</div>';
    const myTxs=DB.transactions.filter(tx=>tx.team_id===t.id).slice(0,10);
    const txH=myTxs.map(tx=>{
      const s=SC[tx.station_name]||{i:'💰',bg:'rgba(255,255,255,.08)'};
      const lbl=tx.type==='invest'?'Invested':tx.type==='return'?'Return':tx.type==='adjust'?'Adjustment':'Event';
      const tag=tx.tag?`<span style="font-size:11px;background:var(--bg4);border-radius:5px;padding:2px 7px;margin-left:6px;color:var(--txt2)">${tx.tag}</span>`:'';
      return `<div class="tx-row"><div class="tx-ic" style="background:${s.bg}">${s.i}</div>
        <div class="tx-in"><div class="tx-nm">${lbl}: ${tx.station_name}${tag}</div><div class="tx-ti">Round ${tx.round} · ${new Date(tx.ts).toLocaleTimeString()}</div></div>
        <div class="tx-am ${tx.amount<0?'neg':'pos'}">${tx.amount<0?'':'+'}${fmt(Math.abs(tx.amount))}</div></div>`;
    }).join('')||'<div class="empty">No transactions yet</div>';
    c.innerHTML=`
      <div class="g4">
      <div class="stat-tile" style="--tile-grad:linear-gradient(135deg,rgba(77,168,255,.14),transparent)"><div class="stat-ico">💵</div><div class="stat-l">Cash Left</div><div class="stat-v" style="font-size:17px">${fmt(t.bal)}</div></div>
        <div class="stat-tile" style="--tile-grad:linear-gradient(135deg,rgba(163,116,255,.14),transparent)"><div class="stat-ico">📊</div><div class="stat-l">Invested</div><div class="stat-v" style="font-size:17px">${fmt(tot)}</div></div>
        <div class="stat-tile" style="--tile-grad:linear-gradient(135deg,rgba(0,214,138,.14),transparent)"><div class="stat-ico">💎</div><div class="stat-l">Net Worth</div><div class="stat-v" style="font-size:17px;color:#00D68A">${fmt(n)}</div>
          <div class="stat-s" style="color:${d>=0?'#00D68A':'#FF5252'}">${d>=0?'▲':'▼'} ${fmt(Math.abs(d))}</div></div>
        <div class="stat-tile" style="--tile-grad:linear-gradient(135deg,rgba(255,184,48,.14),transparent)"><div class="stat-ico">🎯</div><div class="stat-l">Round</div><div class="stat-v">${DB.game.cur_round||'—'}<span style="font-size:14px;color:var(--txt2)"> / ${DB.game.total_rounds}</span></div>
          <div class="stat-s">${t.insured?'🛡️ Protected':''}</div></div>
      </div>
      <div class="g2">
        <div class="sec"><div class="sec-h"><span class="sec-t">📊 My Portfolio</span><span class="badge badge-p">${pct}% invested</span></div>${portItems}</div>
        <div class="sec"><div class="sec-h"><span class="sec-t">⚡ My Transactions</span></div>${txH}</div>
      </div>`;
  } else {
    c.innerHTML=`<div class="sec"><div class="sec-h"><span class="sec-t">📈 Stock Market</span></div>${stockChartUI(false)}</div>`;
  }
}

// ── MODAL & TOAST ──
window.modal=html=>document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
window.closeModal=()=>document.getElementById('modalRoot').innerHTML='';
window.toast=(msg,type='g')=>{
  const t=document.createElement('div');
  const col={g:'linear-gradient(135deg,#00D68A,#00AA6E)',r:'linear-gradient(135deg,#FF5252,#CC2222)',a:'linear-gradient(135deg,#FFB830,#CC8800)'};
  t.style.cssText=`position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:${col[type]||col.g};color:#fff;padding:12px 22px;border-radius:16px;font-size:14px;font-weight:700;z-index:999;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.5);letter-spacing:.02em`;
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
};

boot();
