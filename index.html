<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Planet X Economy Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;font-family:monospace;color:#e2e8f0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0a0f}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
select option{background:#0f172a;color:#e2e8f0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useCallback,useEffect,useRef}=React;

const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2);
const COLORS=["#8b5cf6","#06b6d4","#f59e0b","#ec4899","#22c55e","#3b82f6","#ef4444","#14b8a6","#f97316","#6366f1","#84cc16","#e879f9","#fb7185","#38bdf8","#a3e635"];
function netWorth(team,commodities){
  return team.cash+Object.entries(team.holdings).reduce((s,[id,qty])=>{
    const c=commodities.find(x=>x.id===id);return s+qty*(c?c.price:0);
  },0);
}
const ts=()=>new Date().toLocaleTimeString();

const INIT_COMMODITIES=[
  {id:"food",name:"Food",icon:"🌾",color:"#22c55e",price:500},
  {id:"tech",name:"Tech",icon:"💻",color:"#3b82f6",price:1200},
  {id:"energy",name:"Energy",icon:"⚡",color:"#eab308",price:800},
  {id:"metals",name:"Metals",icon:"⛏️",color:"#94a3b8",price:650},
  {id:"medicine",name:"Medicine",icon:"💊",color:"#ec4899",price:950},
];
const INIT_SCENARIOS=[
  {id:"s1",name:"Solar Surge",desc:"Solar energy floods the grid.",effects:{food:1.05,tech:0.95,energy:1.4,metals:1.0,medicine:1.0}},
  {id:"s2",name:"Energy Crisis",desc:"Fuel shortages hit the colony hard.",effects:{food:1.2,tech:0.9,energy:1.8,metals:0.95,medicine:1.1}},
  {id:"s3",name:"Tech Boom",desc:"Innovation wave boosts tech sector.",effects:{food:1.0,tech:1.6,energy:1.1,metals:1.2,medicine:0.9}},
  {id:"s4",name:"Food Shortage",desc:"Crop blight devastates food supply.",effects:{food:2.0,tech:0.95,energy:1.0,metals:1.0,medicine:1.3}},
  {id:"s5",name:"Meteor Strike",desc:"Rich ore deposits discovered!",effects:{food:1.1,tech:1.0,energy:0.8,metals:1.9,medicine:1.0}},
];
const INIT_SALARIES=[3000,1000,1000,0,1000];
const TEAM_NAMES=["Nova Squad","Iron Wolves","Quantum Crew","Stellar Five","Red Comet","Dark Matter","Void Runners","Nebula Six","Orbit Team","Blaze Unit","Cosmic Nine","Titan Force","Zero Gravity","Warp Drive","Solar Flare"];

function makeTeams(commodities){
  return TEAM_NAMES.map((name,i)=>({
    id:`t${i}`,name,color:COLORS[i%COLORS.length],
    cash:6000,holdings:Object.fromEntries(commodities.map(c=>[c.id,0])),transactions:[],
  }));
}

// ── UI atoms ──
function Btn({children,onClick,color="#4c1d95",border="#7c3aed",textColor="#e2e8f0",style={},disabled=false}){
  return <button onClick={onClick} disabled={disabled} style={{background:disabled?"#1e293b":color,border:`1px solid ${disabled?"#334155":border}`,color:disabled?"#475569":textColor,padding:"8px 14px",borderRadius:8,cursor:disabled?"not-allowed":"pointer",fontFamily:"monospace",fontSize:13,letterSpacing:.5,...style}}>{children}</button>;
}
function Input({value,onChange,placeholder,type="text",style={}}){
  return <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{padding:"8px 10px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,color:"#e2e8f0",fontFamily:"monospace",fontSize:13,outline:"none",...style}}/>;
}
function Card({children,style={}}){
  return <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:12,padding:"1.25rem",...style}}>{children}</div>;
}
function SectionLabel({children}){
  return <p style={{color:"#475569",fontSize:10,letterSpacing:1.5,margin:"0 0 10px",textTransform:"uppercase"}}>{children}</p>;
}
function Avatar({name,color,size=36}){
  return <div style={{width:size,height:size,borderRadius:"50%",background:color+"33",border:`2px solid ${color}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size>40?13:10,fontWeight:700,color,flexShrink:0}}>{initials(name)}</div>;
}
function PriceBadge({c}){
  return(
    <div style={{background:"#0f172a",borderRadius:8,padding:"10px 8px",textAlign:"center",border:`1px solid ${c.color}33`}}>
      <div style={{fontSize:20}}>{c.icon}</div>
      <div style={{fontSize:11,color:"#64748b",margin:"2px 0"}}>{c.name}</div>
      <div style={{fontSize:14,fontWeight:700,color:c.color}}>🪙 {c.price.toLocaleString()}</div>
    </div>
  );
}
function TxBadge({type}){
  const map={buy:["#052e16","#86efac"],sell:["#1e1b4b","#c4b5fd"],salary:["#1c1917","#fbbf24"],bonus:["#052e16","#86efac"],penalty:["#450a0a","#fca5a5"],deduction:["#450a0a","#fca5a5"],adjustment:["#172554","#93c5fd"]};
  const[bg,fg]=map[type]||["#1e293b","#94a3b8"];
  return <span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:bg,color:fg}}>{type.toUpperCase()}</span>;
}
function Sparkline({data,color,width=180,height=60}){
  if(!data||data.length<2)return <div style={{color:"#334155",fontSize:11,padding:"1rem"}}>Not enough data yet.</div>;
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*width;
    const y=height-((v-min)/range)*(height-8)-4;
    return `${x},${y}`;
  }).join(" ");
  return(
    <svg width={width} height={height} style={{overflow:"visible"}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
      {data.map((v,i)=>{
        const x=(i/(data.length-1))*width;
        const y=height-((v-min)/range)*(height-8)-4;
        return <circle key={i} cx={x} cy={y} r={3} fill={color}/>;
      })}
    </svg>
  );
}

// ── PIN Login ──
function PinLogin({title,sub,icon,correctPin,onSuccess,onBack}){
  const[val,setVal]=useState("");const[err,setErr]=useState("");
  const attempt=()=>{if(val===correctPin)onSuccess();else{setErr("Incorrect PIN");setVal("");}};
  return(
    <div style={{background:"#0a0a0f",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:16,padding:"3rem 2.5rem",width:320,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:8}}>{icon}</div>
        <h2 style={{color:"#a78bfa",margin:"0 0 4px",letterSpacing:2,fontSize:18}}>{title}</h2>
        <p style={{color:"#475569",fontSize:11,margin:"0 0 2rem"}}>{sub}</p>
        <Input type="password" value={val} onChange={e=>setVal(e.target.value)} placeholder="Enter PIN" style={{width:"100%",textAlign:"center",fontSize:20,letterSpacing:8}} onKeyDown={e=>e.key==="Enter"&&attempt()}/>
        {err&&<p style={{color:"#ef4444",fontSize:12,margin:"8px 0 0"}}>{err}</p>}
        <Btn onClick={attempt} style={{width:"100%",marginTop:16,padding:"10px"}}>ENTER</Btn>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:12,marginTop:12,fontFamily:"monospace"}}>← Back</button>
      </div>
    </div>
  );
}

// ── Team Login ──
function TeamLogin({teams,onSelect,onBack}){
  const[sel,setSel]=useState("");
  return(
    <div style={{background:"radial-gradient(ellipse at 50% 30%,#0d1f0d,#0a0a0f)",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#111118",border:"1px solid #166534",borderRadius:20,padding:"3rem 2.5rem",width:360,textAlign:"center",boxShadow:"0 0 40px #22c55e18"}}>
        <div style={{fontSize:44,marginBottom:10}}>🚀</div>
        <h2 style={{color:"#86efac",margin:"0 0 4px",letterSpacing:2,fontSize:20}}>TEAM LOGIN</h2>
        <p style={{color:"#475569",fontSize:12,margin:"0 0 2rem"}}>SELECT YOUR TEAM</p>
        <select value={sel} onChange={e=>setSel(e.target.value)} style={{width:"100%",padding:"12px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:10,color:sel?"#e2e8f0":"#475569",fontFamily:"monospace",fontSize:14,marginBottom:16}}>
          <option value="">— Choose your team —</option>
          {teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <Btn onClick={()=>sel&&onSelect(sel)} disabled={!sel} color="#14532d" border="#22c55e" textColor="#86efac" style={{width:"100%",padding:"12px",fontSize:15}}>ENTER DASHBOARD</Btn>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:12,marginTop:16,fontFamily:"monospace"}}>← Back</button>
      </div>
    </div>
  );
}

// ── Landing ──
function Landing({setScreen,adminPin,operatorPin}){
  const[showAdminLogin,setShowAdminLogin]=useState(false);
  const[showOpLogin,setShowOpLogin]=useState(false);
  return(
    <div style={{background:"radial-gradient(ellipse at 60% 20%,#1a0a2e 0%,#0a0a0f 60%)",minHeight:"100vh",display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
        {[...Array(40)].map((_,i)=>(
          <div key={i} style={{position:"absolute",width:i%5===0?2:1,height:i%5===0?2:1,background:"white",borderRadius:"50%",opacity:Math.random()*0.6+0.2,left:`${(i*37+13)%100}%`,top:`${(i*53+7)%100}%`}}/>
        ))}
      </div>
      <div style={{position:"absolute",bottom:16,right:16,display:"flex",gap:8,zIndex:10}}>
        <button onClick={()=>setShowAdminLogin(true)} style={{background:"#111118",border:"1px solid #1e293b",borderRadius:8,color:"#334155",cursor:"pointer",fontFamily:"monospace",fontSize:10,padding:"5px 10px",opacity:.5}}>⬡</button>
        <button onClick={()=>setShowOpLogin(true)} style={{background:"#111118",border:"1px solid #1e293b",borderRadius:8,color:"#334155",cursor:"pointer",fontFamily:"monospace",fontSize:10,padding:"5px 10px",opacity:.5}}>⚙</button>
        <button onClick={()=>setScreen("display")} style={{background:"#111118",border:"1px solid #1e293b",borderRadius:8,color:"#334155",cursor:"pointer",fontFamily:"monospace",fontSize:10,padding:"5px 10px",opacity:.5}}>📺</button>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2.5rem",padding:"2rem"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:56,marginBottom:16}}>🪐</div>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"center",lineHeight:1}}>
            <span style={{fontSize:90,fontWeight:900,color:"#ffffff",letterSpacing:-3}}>X</span>
            <span style={{fontSize:42,fontWeight:500,color:"#a78bfa",letterSpacing:1}}>plore</span>
          </div>
          <p style={{color:"#475569",fontSize:12,margin:"10px 0 0",letterSpacing:3}}>ECONOMY SIMULATION PLATFORM</p>
        </div>
        <div style={{background:"linear-gradient(135deg,#0d1f0d,#0a180a)",border:"1px solid #166534",borderRadius:20,padding:"2.5rem 3rem",width:360,textAlign:"center",boxShadow:"0 0 40px #22c55e18"}}>
          <div style={{fontSize:36,marginBottom:10}}>🚀</div>
          <h2 style={{color:"#86efac",margin:"0 0 6px",letterSpacing:2,fontSize:18}}>TEAM DASHBOARD</h2>
          <p style={{color:"#475569",fontSize:12,margin:"0 0 1.5rem"}}>Select your team to view your status</p>
          <Btn onClick={()=>setScreen("team")} color="#14532d" border="#22c55e" textColor="#86efac" style={{width:"100%",padding:"12px",fontSize:15,letterSpacing:1}}>ENTER TEAM DASHBOARD</Btn>
        </div>
        <p style={{color:"#1e293b",fontSize:11}}>v1.0 · Planet X Economy Simulation</p>
      </div>
      {showAdminLogin&&(
        <div style={{position:"fixed",inset:0,background:"#00000088",display:"flex",alignItems:"flex-end",justifyContent:"flex-end",padding:24,zIndex:50}}>
          <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:14,padding:"1.5rem",width:260,boxShadow:"0 20px 60px #000"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{color:"#a78bfa",fontSize:13,fontWeight:700}}>⬡ Super Admin</span>
              <button onClick={()=>setShowAdminLogin(false)} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:16}}>✕</button>
            </div>
            <MiniPin correctPin={adminPin} onSuccess={()=>{setShowAdminLogin(false);setScreen("admin");}} onClose={()=>setShowAdminLogin(false)}/>
          </div>
        </div>
      )}
      {showOpLogin&&(
        <div style={{position:"fixed",inset:0,background:"#00000088",display:"flex",alignItems:"flex-end",justifyContent:"flex-end",padding:24,zIndex:50}}>
          <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:14,padding:"1.5rem",width:260,boxShadow:"0 20px 60px #000"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{color:"#a78bfa",fontSize:13,fontWeight:700}}>⚙ Operator</span>
              <button onClick={()=>setShowOpLogin(false)} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:16}}>✕</button>
            </div>
            <MiniPin correctPin={operatorPin} onSuccess={()=>{setShowOpLogin(false);setScreen("operator");}} onClose={()=>setShowOpLogin(false)}/>
          </div>
        </div>
      )}
    </div>
  );
}
function MiniPin({correctPin,onSuccess,onClose}){
  const[val,setVal]=useState("");const[err,setErr]=useState("");
  const attempt=()=>{if(val===correctPin)onSuccess();else{setErr("Incorrect PIN");setVal("");}};
  return(
    <>
      <input type="password" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="PIN" style={{padding:"8px 10px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,color:"#e2e8f0",fontFamily:"monospace",fontSize:13,outline:"none",width:"100%",textAlign:"center",letterSpacing:6,marginBottom:8}}/>
      {err&&<p style={{color:"#ef4444",fontSize:11,margin:"0 0 8px"}}>{err}</p>}
      <Btn onClick={attempt} style={{width:"100%"}}>Enter</Btn>
    </>
  );
}

// ── Display Screen ──
function DisplayScreen({commodities,sorted,round,activeScenario,tradingOpen,onBack,priceHistory}){
  return(
    <div style={{background:"#050508",minHeight:"100vh",fontFamily:"monospace",color:"#e2e8f0",display:"flex",flexDirection:"column",padding:"2rem",gap:"2rem"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:4}}>
          <span style={{fontSize:28,fontWeight:900,color:"#fff"}}>Xpl</span><span style={{fontSize:18,color:"#a78bfa"}}>ore</span><span style={{fontSize:28,fontWeight:900,color:"#fff"}}> X</span>
          <span style={{color:"#475569",fontSize:13,marginLeft:16}}>Round {round} · {activeScenario.name}</span>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <span style={{fontSize:13,color:tradingOpen?"#22c55e":"#ef4444",background:tradingOpen?"#052e16":"#450a0a",padding:"5px 14px",borderRadius:20,border:`1px solid ${tradingOpen?"#166534":"#991b1b"}`}}>● {tradingOpen?"TRADING OPEN":"TRADING CLOSED"}</span>
          <button onClick={onBack} style={{background:"none",border:"1px solid #1e293b",borderRadius:8,color:"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:11,padding:"5px 10px"}}>← Back</button>
        </div>
      </div>
      <div>
        <p style={{color:"#475569",fontSize:11,letterSpacing:2,margin:"0 0 12px"}}>LIVE MARKET PRICES</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:14}}>
          {commodities.map(c=>{
            const hist=priceHistory[c.id]||[];
            const prev=hist.length>=2?hist[hist.length-2]:null;
            const change=prev?((c.price-prev)/prev*100).toFixed(1):null;
            return(
              <div key={c.id} style={{background:"#0f172a",borderRadius:14,padding:"1.5rem",textAlign:"center",border:`1px solid ${c.color}44`,boxShadow:`0 0 20px ${c.color}11`}}>
                <div style={{fontSize:36,marginBottom:6}}>{c.icon}</div>
                <div style={{fontSize:15,color:"#94a3b8",marginBottom:6}}>{c.name}</div>
                <div style={{fontSize:30,fontWeight:900,color:c.color}}>🪙 {c.price.toLocaleString()}</div>
                {change!==null&&<div style={{fontSize:13,marginTop:6,color:parseFloat(change)>0?"#22c55e":parseFloat(change)<0?"#ef4444":"#64748b"}}>{parseFloat(change)>0?"▲":"▼"} {Math.abs(change)}%</div>}
              </div>
            );
          })}
        </div>
      </div>
      <div>
        <p style={{color:"#475569",fontSize:11,letterSpacing:2,margin:"0 0 12px"}}>LEADERBOARD</p>
        <div style={{display:"grid",gap:10}}>
          {sorted.map((t,i)=>{
            const nw=netWorth(t,commodities);
            const pct=sorted[0]?(nw/netWorth(sorted[0],commodities))*100:100;
            return(
              <div key={t.id} style={{background:"#0f172a",borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,border:i<3?`1px solid ${t.color}44`:"1px solid #1e293b"}}>
                <span style={{fontSize:i<3?26:14,width:34,textAlign:"center",color:i<3?"inherit":"#475569",flexShrink:0}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`}</span>
                <Avatar name={t.name} color={t.color} size={40}/>
                <div style={{flex:1}}>
                  <p style={{margin:"0 0 4px",fontSize:14,color:"#e2e8f0",fontWeight:700}}>{t.name}</p>
                  <div style={{height:4,background:"#1e293b",borderRadius:2}}><div style={{height:"100%",width:`${pct}%`,background:t.color,borderRadius:2}}/></div>
                </div>
                <p style={{margin:0,fontSize:16,color:"#a78bfa",fontWeight:900,flexShrink:0}}>🪙 {nw.toLocaleString()}</p>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Admin Portal ──
function AdminPortal(props){
  const[authed,setAuthed]=useState(false);
  const[sideOpen,setSideOpen]=useState(true);
  const[activePage,setActivePage]=useState("mission");
  if(!authed)return <PinLogin title="SUPER ADMIN" sub="MISSION CONTROL ACCESS" icon="⬡" correctPin={props.adminPin} onSuccess={()=>setAuthed(true)} onBack={props.onLogout}/>;
  const pages=[
    {id:"mission",icon:"🛸",label:"Mission Control"},
    {id:"scenarios",icon:"🌌",label:"Scenarios"},
    {id:"commodities",icon:"📦",label:"Commodities"},
    {id:"salaries",icon:"🪙",label:"Salaries"},
    {id:"teams",icon:"👥",label:"Teams"},
    {id:"leaderboard",icon:"🏆",label:"Leaderboard"},
    {id:"operators",icon:"🔐",label:"Operators"},
    {id:"audit",icon:"📋",label:"Audit Log"},
    {id:"danger",icon:"⚠️",label:"Danger Zone"},
  ];
  return(
    <div style={{display:"flex",minHeight:"100vh",background:"#0a0a0f"}}>
      <div style={{width:sideOpen?220:56,flexShrink:0,background:"#0d0d14",borderRight:"1px solid #1e293b",display:"flex",flexDirection:"column",transition:"width .2s",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:sideOpen?"space-between":"center",padding:"14px 12px",borderBottom:"1px solid #1e293b"}}>
          {sideOpen&&<span style={{color:"#a78bfa",fontWeight:700,fontSize:13,letterSpacing:1,whiteSpace:"nowrap"}}>⬡ PLANET X</span>}
          <button onClick={()=>setSideOpen(o=>!o)} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:18,lineHeight:1,padding:2}}>{sideOpen?"‹":"›"}</button>
        </div>
        <div style={{flex:1,padding:"8px 6px",overflowY:"auto"}}>
          {pages.map(p=>(
            <button key={p.id} onClick={()=>setActivePage(p.id)} title={p.label} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:8,background:activePage===p.id?"#1e1b4b":"transparent",border:activePage===p.id?"1px solid #3730a3":"1px solid transparent",color:activePage===p.id?"#c4b5fd":"#64748b",cursor:"pointer",fontFamily:"monospace",fontSize:13,marginBottom:2,textAlign:"left",whiteSpace:"nowrap",overflow:"hidden"}}>
              <span style={{flexShrink:0,fontSize:16}}>{p.icon}</span>
              {sideOpen&&<span>{p.label}</span>}
            </button>
          ))}
        </div>
        <div style={{padding:"10px 6px",borderTop:"1px solid #1e293b"}}>
          <button onClick={props.onLogout} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:8,background:"transparent",border:"none",color:"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:13,textAlign:"left",whiteSpace:"nowrap"}}>
            <span style={{flexShrink:0}}>🚪</span>{sideOpen&&<span>Logout</span>}
          </button>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
        <div style={{background:"#111118",borderBottom:"1px solid #1e293b",padding:"12px 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <span style={{color:"#e2e8f0",fontSize:15,fontWeight:700}}>{pages.find(p=>p.id===activePage)?.label}</span>

function PageScenarios({scenarios,setScenarios,commodities,addAudit}){
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState(null);
  const[newName,setNewName]=useState("");const[newDesc,setNewDesc]=useState("");
  function openEdit(sc){setEditing(sc.id);setForm({name:sc.name,desc:sc.desc,effects:{...sc.effects}});}
  function saveEdit(){setScenarios(s=>s.map(x=>x.id===editing?{...x,...form}:x));addAudit(`Scenario updated: ${form.name}`);setEditing(null);setForm(null);}
  function deleteScenario(id){setScenarios(s=>s.filter(x=>x.id!==id));addAudit(`Scenario deleted`);}
  function addScenario(){
    if(!newName.trim())return;
    const effects=Object.fromEntries(commodities.map(c=>[c.id,1]));
    setScenarios(s=>[...s,{id:`sc${Date.now()}`,name:newName,desc:newDesc,effects}]);
    addAudit(`Scenario added: ${newName}`);setNewName("");setNewDesc("");
  }
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:"1.5rem"}}>
        {scenarios.map(sc=>(
          <Card key={sc.id}>
            {editing===sc.id&&form?(
              <div>
                <Input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} style={{width:"100%",marginBottom:8,boxSizing:"border-box"}}/>
                <Input value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} style={{width:"100%",marginBottom:12,boxSizing:"border-box"}}/>
                <SectionLabel>Price Multipliers</SectionLabel>
                {commodities.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:16}}>{c.icon}</span>
                    <span style={{flex:1,fontSize:13,color:"#e2e8f0"}}>{c.name}</span>
                    <Input type="number" value={form.effects[c.id]||1} onChange={e=>setForm(f=>({...f,effects:{...f.effects,[c.id]:parseFloat(e.target.value)||1}}))} style={{width:70,textAlign:"center"}}/>
                    <span style={{fontSize:11,color:(form.effects[c.id]||1)>1?"#22c55e":(form.effects[c.id]||1)<1?"#ef4444":"#64748b"}}>{(((form.effects[c.id]||1)-1)*100).toFixed(0)}%</span>
                  </div>
                ))}
                <div style={{display:"flex",gap:6,marginTop:10}}>
                  <Btn onClick={saveEdit} color="#14532d" border="#22c55e" textColor="#86efac" style={{flex:1}}>Save</Btn>
                  <Btn onClick={()=>setEditing(null)} color="#1e293b" border="#334155" style={{flex:1}}>Cancel</Btn>
                </div>
              </div>
            ):(
              <div>
                <p style={{margin:"0 0 2px",fontSize:14,color:"#e2e8f0",fontWeight:700}}>{sc.name}</p>
                <p style={{margin:"0 0 10px",fontSize:11,color:"#64748b"}}>{sc.desc}</p>
                <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
                  {commodities.map(c=>{const eff=sc.effects[c.id]||1;const col=eff>1?"#22c55e":eff<1?"#ef4444":"#64748b";return <span key={c.id} style={{fontSize:11,padding:"2px 6px",borderRadius:4,background:"#0f172a",color:col}}>{c.icon} {eff>1?"+":""}{((eff-1)*100).toFixed(0)}%</span>;})}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Btn onClick={()=>openEdit(sc)} style={{flex:1,padding:"6px"}}>✏ Edit</Btn>
                  <Btn onClick={()=>deleteScenario(sc.id)} color="#450a0a" border="#991b1b" textColor="#fca5a5" style={{flex:1,padding:"6px"}}>✕ Delete</Btn>
                </div>
              </div>
            )}
          </Card>
        ))}
      </div>
      <Card>
        <SectionLabel>Add New Scenario</SectionLabel>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <Input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Scenario name" style={{flex:1}}/>
          <Input value={newDesc} onChange={e=>setNewDesc(e.target.value)} placeholder="Short description" style={{flex:2}}/>
        </div>
        <Btn onClick={addScenario} color="#14532d" border="#22c55e" textColor="#86efac">+ Add Scenario</Btn>
      </Card>
    </div>
  );
}

function PageTeams({teams,setTeams,commodities,addAudit,sorted}){
  const[selId,setSelId]=useState(null);
  const[newName,setNewName]=useState("");
  const[adjAmt,setAdjAmt]=useState(500);
  const[adjReason,setAdjReason]=useState("");
  const[adjType,setAdjType]=useState("add");
  const team=teams.find(t=>t.id===selId);
  function addTeam(){if(!newName.trim())return;const nc={id:`t${Date.now()}`,name:newName,color:COLORS[teams.length%COLORS.length],cash:6000,holdings:Object.fromEntries(commodities.map(c=>[c.id,0])),transactions:[]};setTeams(t=>[...t,nc]);addAudit(`Team added: ${newName}`);setNewName("");}
  function delTeam(id){setTeams(t=>t.filter(x=>x.id!==id));if(selId===id)setSelId(null);addAudit(`Team removed`);}
  function applyAdj(){
    if(!adjReason||!team)return;
    const delta=adjType==="add"?adjAmt:-adjAmt;
    setTeams(prev=>prev.map(t=>{if(t.id!==selId)return t;const tx={type:"adjustment",commodityId:null,qty:1,amount:Math.abs(delta),reason:adjReason,ts:ts()};return{...t,cash:t.cash+delta,transactions:[tx,...t.transactions]};}));
    addAudit(`Cash ${adjType==="add"?"+":"-"}🪙${adjAmt} → ${team.name}: ${adjReason}`);setAdjReason("");
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1.4fr",gap:"1.5rem"}}>
      <Card>
        <SectionLabel>All Teams</SectionLabel>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <Input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="New team name" style={{flex:1}}/>
          <Btn onClick={addTeam} color="#14532d" border="#22c55e" textColor="#86efac">Add</Btn>
        </div>
        <div style={{maxHeight:420,overflowY:"auto"}}>
          {sorted.map((t,i)=>(
            <div key={t.id} onClick={()=>setSelId(t.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selId===t.id?"#1e1b4b":"transparent",border:selId===t.id?"1px solid #3730a3":"1px solid transparent",marginBottom:4}}>
              <span style={{color:"#475569",fontSize:11,width:18}}>#{i+1}</span>
              <Avatar name={t.name} color={t.color} size={30}/>
              <div style={{flex:1}}><p style={{margin:0,fontSize:13,color:"#e2e8f0"}}>{t.name}</p><p style={{margin:0,fontSize:11,color:"#64748b"}}>🪙 {netWorth(t,commodities).toLocaleString()}</p></div>
              <button onClick={e=>{e.stopPropagation();delTeam(t.id);}} style={{background:"#450a0a",border:"none",borderRadius:4,color:"#fca5a5",cursor:"pointer",fontSize:11,padding:"2px 7px"}}>✕</button>
            </div>
          ))}
        </div>
      </Card>
      <div>
        {!team?<Card><p style={{color:"#334155",textAlign:"center",padding:"2rem 0"}}>Select a team to view details.</p></Card>:(
          <Card>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:"1rem"}}>
              <Avatar name={team.name} color={team.color} size={44}/>
              <div>
                <p style={{margin:0,fontSize:16,color:"#e2e8f0"}}>{team.name}</p>
                <p style={{margin:0,fontSize:12,color:"#22c55e"}}>🪙 {team.cash.toLocaleString()} cash · NW: 🪙 {netWorth(team,commodities).toLocaleString()}</p>
              </div>
            </div>
            <SectionLabel>Holdings</SectionLabel>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:"1rem"}}>
              {commodities.map(c=>(
                <div key={c.id} style={{background:"#0f172a",borderRadius:8,padding:"8px",textAlign:"center",opacity:(team.holdings[c.id]||0)===0?.4:1}}>
                  <div style={{fontSize:18}}>{c.icon}</div>
                  <div style={{fontSize:13,color:c.color,fontWeight:700}}>{team.holdings[c.id]||0}</div>
                  <div style={{fontSize:10,color:"#64748b"}}>{c.name}</div>
                </div>
              ))}
            </div>
            <SectionLabel>Cash Adjustment</SectionLabel>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              {["add","deduct"].map(type=>(
                <button key={type} onClick={()=>setAdjType(type)} style={{flex:1,padding:"7px",background:adjType===type?(type==="add"?"#052e16":"#450a0a"):"#0f172a",border:`1px solid ${adjType===type?(type==="add"?"#22c55e":"#ef4444"):"#1e293b"}`,color:adjType===type?(type==="add"?"#86efac":"#fca5a5"):"#64748b",borderRadius:7,cursor:"pointer",fontSize:12,fontFamily:"monospace"}}>{type==="add"?"＋ Add Cash":"－ Deduct Cash"}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              <Input type="number" value={adjAmt} onChange={e=>setAdjAmt(parseInt(e.target.value)||0)} style={{width:100}}/>
              <Input value={adjReason} onChange={e=>setAdjReason(e.target.value)} placeholder="Reason" style={{flex:1}}/>
            </div>
            <Btn onClick={applyAdj} style={{width:"100%",marginBottom:"1rem"}}>Apply</Btn>
            <SectionLabel>Recent Transactions</SectionLabel>
            <div style={{maxHeight:160,overflowY:"auto"}}>
              {team.transactions.slice(0,20).map((tx,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid #0f172a",fontSize:12}}>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}><TxBadge type={tx.type}/><span style={{color:"#94a3b8"}}>{tx.reason}</span></div>
                  <span style={{color:["sell","salary","bonus"].includes(tx.type)?"#22c55e":"#ef4444"}}>{["sell","salary","bonus"].includes(tx.type)?"+":"-"}🪙{(tx.qty*(tx.amount||0)||tx.amount).toLocaleString()}</span>
                </div>
              ))}
            </div>
          </Card>
        )}
      </div>
    </div>
  );
}

function OperatorPortal({operatorPin,commodities,teams,tradingOpen,applyTx,addAudit,onLogout}){
  const[authed,setAuthed]=useState(false);
  const[selTeam,setSelTeam]=useState(null);
  const[txType,setTxType]=useState("buy");
  const[selComm,setSelComm]=useState(commodities[0]?.id);
  const[qty,setQty]=useState(1);
  const[bonusAmt,setBonusAmt]=useState(500);
  const[bonusReason,setBonusReason]=useState("");
  const[search,setSearch]=useState("");
  const[msg,setMsg]=useState("");
  if(!authed)return <PinLogin title="OPERATOR STATION" sub="TRADING OPERATIONS" icon="⚙" correctPin={operatorPin} onSuccess={()=>setAuthed(true)} onBack={onLogout}/>;
  const team=teams.find(t=>t.id===selTeam);
  const comm=commodities.find(c=>c.id===selComm);
  const filtered=teams.filter(t=>t.name.toLowerCase().includes(search.toLowerCase()));
  function doTrade(){
    if(!team||!tradingOpen)return;
    const total=qty*(comm?.price||0);
    if(txType==="buy"&&team.cash<total){setMsg("❌ Insufficient funds");return;}
    if(txType==="sell"&&(team.holdings[selComm]||0)<qty){setMsg("❌ Insufficient stock");return;}
    applyTx(team.id,txType,selComm,qty,comm.price,`${txType} ${comm.name}`);
    addAudit(`[OP] ${txType.toUpperCase()} ${qty}x ${comm.name} @ 🪙${comm.price} for ${team.name}`);
    setMsg(`✅ ${txType==="buy"?"Bought":"Sold"} ${qty}x ${comm.name}`);
    setTimeout(()=>setMsg(""),2500);
  }
  function doBonus(isBonus){
    if(!team||!bonusReason){setMsg("❌ Add a reason");return;}
    applyTx(team.id,isBonus?"bonus":"penalty",null,1,bonusAmt,bonusReason);
    addAudit(`[OP] ${isBonus?"BONUS":"PENALTY"} 🪙${bonusAmt} → ${team.name}: ${bonusReason}`);
    setMsg(`✅ ${isBonus?"+":"-"}🪙${bonusAmt} applied`);
    setBonusReason("");setTimeout(()=>setMsg(""),2500);

    <div style={{background:"#0a0a0f",minHeight:"100vh",fontFamily:"monospace",color:"#e2e8f0"}}>

        </div>
      </div>
      <div style={{padding:"1.5rem",display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1.5rem"}}>
        <div>
          <Card style={{marginBottom:"1rem"}}>
            <SectionLabel>Market Prices</SectionLabel>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>
              {commodities.map(c=><PriceBadge key={c.id} c={c}/>)}

          </Card>
          <Card>
            <SectionLabel>Select Team</SectionLabel>
            <Input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search teams..." style={{width:"100%",marginBottom:8,boxSizing:"border-box"}}/>
            <div style={{maxHeight:320,overflowY:"auto"}}>

                <div key={t.id} onClick={()=>setSelTeam(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selTeam===t.id?"#1e1b4b":"transparent",border:selTeam===t.id?"1px solid #3730a3":"1px solid transparent",marginBottom:4}}>

// ── Root App ──
function App(){
  const[screen,setScreen]=useState("landing");
  const[commodities,setCommodities]=useState(INIT_COMMODITIES);
  const[scenarios,setScenarios]=useState(INIT_SCENARIOS);
  const[salaries,setSalaries]=useState(INIT_SALARIES);
  const[teams,setTeams]=useState(()=>makeTeams(INIT_COMMODITIES));
  const[round,setRound]=useState(1);
  const[activeScenario,setActiveScenario]=useState(INIT_SCENARIOS[0]);
  const[tradingOpen,setTradingOpen]=useState(true);
  const[auditLog,setAuditLog]=useState([]);
  const[pendingSalaries,setPendingSalaries]=useState([]);
  const[adminPin,setAdminPin]=useState("1234");
  const[operatorPin,setOperatorPin]=useState("0000");
  const[activeTeamId,setActiveTeamId]=useState(null);
  const[priceHistory,setPriceHistory]=useState(()=>Object.fromEntries(INIT_COMMODITIES.map(c=>[c.id,[c.price]])));

  const addAudit=useCallback((msg)=>{setAuditLog(l=>[{msg,ts:ts()},...l].slice(0,200));},[]);

  const applyTx=useCallback((teamId,type,commodityId,qty,amount,reason)=>{
    setTeams(prev=>prev.map(t=>{
      if(t.id!==teamId)return t;
      let cash=t.cash,holdings={...t.holdings};
      if(type==="buy"){cash-=qty*amount;holdings[commodityId]=(holdings[commodityId]||0)+qty;}
      if(type==="sell"){cash+=qty*amount;holdings[commodityId]=Math.max(0,(holdings[commodityId]||0)-qty);}
      if(type==="salary"||type==="bonus")cash+=amount;
      if(type==="penalty")cash-=amount;
      if(type==="adjustment")cash+=amount;
      const tx={type,commodityId,qty,amount,reason,ts:ts()};
      return{...t,cash,holdings,transactions:[tx,...t.transactions].slice(0,100)};
    }));
  },[]);

  const startRound=useCallback((nextRound,scenarioId)=>{
    const sc=scenarios.find(s=>s.id===scenarioId)||scenarios[0];
    const newComms=commodities.map(c=>({...c,price:Math.round(c.price*(sc.effects[c.id]||1))}));
    setCommodities(newComms);
    setPriceHistory(prev=>{const next={...prev};newComms.forEach(c=>{next[c.id]=[...(prev[c.id]||[]),c.price];});return next;});
    setRound(nextRound);setActiveScenario(sc);setTradingOpen(true);
    const sal=salaries[(nextRound-1)%salaries.length];
    if(sal>0){
      setPendingSalaries(teams.map(t=>({teamId:t.id,amount:sal,round:nextRound})));
      addAudit(`Round ${nextRound} started · ${sc.name} · ${teams.length} salary approvals pending`);
    }else{
      addAudit(`Round ${nextRound} started · ${sc.name} · No salary this round`);
    }
  },[scenarios,salaries,teams,commodities,addAudit]);

  const approveSalary=useCallback((teamId)=>{
    const entry=pendingSalaries.find(p=>p.teamId===teamId);
    if(!entry)return;
    applyTx(teamId,"salary",null,1,entry.amount,`Salary R${entry.round}`);
    addAudit(`Salary approved · ${teams.find(t=>t.id===teamId)?.name} · 🪙${entry.amount.toLocaleString()}`);
    setPendingSalaries(p=>p.filter(x=>x.teamId!==teamId));
  },[pendingSalaries,applyTx,addAudit,teams]);

  const approveAllSalaries=useCallback(()=>{
    pendingSalaries.forEach(p=>applyTx(p.teamId,"salary",null,1,p.amount,`Salary R${p.round}`));
    addAudit(`All salaries approved · Round ${round}`);
    setPendingSalaries([]);
  },[pendingSalaries,applyTx,addAudit,round]);

  const resetGame=useCallback(()=>{
    setTeams(makeTeams(commodities));
    setRound(1);setActiveScenario(scenarios[0]);setTradingOpen(true);
    setPendingSalaries([]);setAuditLog([]);
    setPriceHistory(Object.fromEntries(commodities.map(c=>[c.id,[c.price]])));
    addAudit("⚠ GAME RESET by Super Admin");
  },[commodities,scenarios,addAudit]);

  const sorted=[...teams].sort((a,b)=>netWorth(b,commodities)-netWorth(a,commodities));

  const shared={commodities,setCommodities,scenarios,setScenarios,salaries,setSalaries,teams,setTeams,round,setRound,activeScenario,tradingOpen,setTradingOpen,auditLog,pendingSalaries,adminPin,setAdminPin,operatorPin,setOperatorPin,sorted,applyTx,addAudit,startRound,approveSalary,approveAllSalaries,resetGame,activeTeamId,setActiveTeamId,setScreen,priceHistory};

  if(screen==="landing") return <Landing setScreen={setScreen} adminPin={adminPin} operatorPin={operatorPin}/>;
  if(screen==="admin")   return <AdminPortal {...shared} onLogout={()=>setScreen("landing")}/>;
  if(screen==="operator")return <OperatorPortal {...shared} onLogout={()=>setScreen("landing")}/>;
  if(screen==="team")    return <TeamPortal {...shared} onLogout={()=>setScreen("landing")}/>;
  if(screen==="display") return <DisplayScreen {...shared} onBack={()=>setScreen("landing")}/>;
  return <Landing setScreen={setScreen} adminPin={adminPin} operatorPin={operatorPin}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
